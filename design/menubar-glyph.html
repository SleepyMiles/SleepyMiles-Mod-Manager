<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Alfa Slab One"; src: url("https://cdn.jsdelivr.net/npm/@fontsource/alfa-slab-one@5/files/alfa-slab-one-latin-400-normal.woff2") format("woff2"); }
html,body{margin:0;background:transparent} svg{display:block;width:1024px;height:1024px}
</style></head><body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="white"/>
      <!-- SM knocked out of the crate -->
      <g transform="rotate(-6 512 600)">
        <rect x="222" y="382" width="580" height="396" rx="32" fill="black"/>
        <rect x="244" y="404" width="536" height="352" rx="24" fill="white"/>
        <text x="508" y="690" text-anchor="middle" font-family="Alfa Slab One" font-size="250" fill="black">SM</text>
      </g>
    </mask>
  </defs>
  <!-- ring -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="white" stroke-width="72"/>
  <g mask="url(#cut)" fill="white">
    <g transform="rotate(-6 512 600)">
      <g transform="rotate(-18 372 400)"><rect x="300" y="250" width="150" height="260" rx="26"/></g>
      <g transform="rotate(16 640 400)">
        <rect x="590" y="300" width="120" height="220" rx="16"/>
        <rect x="574" y="214" width="152" height="110" rx="16"/>
      </g>
      <!-- gap between lid and items so they read as separate shapes -->
      
      <rect x="244" y="404" width="536" height="352" rx="24"/>
    </g>
  </g>
</svg></body></html>
